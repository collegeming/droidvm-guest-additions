name: build-virtio-gpu-module

# Compile gate for the out-of-tree virtio-gpu module, used to prove a patch in
# this repo still builds. It is not an acceptance test: the headers come from
# whatever linux-aarch64 version the mirror serves (pin with the
# `kernel_headers` input to match the guest's `uname -r`), so a green run means
# "this compiles against an aarch64 Arch kernel of that version", not "this ABI
# matches the VM".
#
# The build runs in an aarch64 container under qemu, not cross-compiled from
# x86: the guest kernel's prepared headers tree ships native kbuild host tools
# (scripts/basic/fixdep, ...) and bakes in flags from the compiler that built it,
# so an x86 cross build fails before it compiles a single line of this module.
#
# Nothing here touches a device. Runtime acceptance still happens on the VM.

on:
  workflow_dispatch:
    inputs:
      kernel_headers:
        description: 'ALARM headers package filename (empty = newest in core)'
        required: false
        default: ''
  push:
    branches: [ 'audit/**' ]
    paths:
      - 'virtio_gpu/**'
      - 'gunyah_guest/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-virtio-gpu-module.yml'

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pin the kernel headers package
        if: inputs.kernel_headers != ''
        run: |
          set -euxo pipefail
          pkg='${{ inputs.kernel_headers }}'
          curl -fsSL "http://mirror.archlinuxarm.org/aarch64/core/$pkg" -o /tmp/headers.pkg.tar.xz
          echo "pin: $pkg (fetched, $(stat -c %s /tmp/headers.pkg.tar.xz) bytes)"

      - name: Build in the guest's own architecture
        run: |
          set -euxo pipefail
          extra=
          if [ -f /tmp/headers.pkg.tar.xz ]; then
            extra='-v /tmp/headers.pkg.tar.xz:/tmp/headers.pkg.tar.xz:ro'
          fi
          # shellcheck disable=SC2086
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" $extra -w /src \
            menci/archlinuxarm:base bash /src/scripts/ci-build-in-container.sh

      - name: Keep the built modules
        uses: actions/upload-artifact@v4
        with:
          name: virtio-gpu-modules
          path: |
            virtio_gpu/*.ko
            gunyah_guest/*.ko
          if-no-files-found: warn
