name: build-virtio-gpu-module

# Compile gate for the out-of-tree virtio-gpu module, used to prove a patch in
# this repo still builds. It is not an acceptance test: the headers come from
# whatever linux-aarch64 version the mirror serves (pin with the `kernel_headers`
# input to match the guest's `uname -r`), so a green run means "this compiles
# against an aarch64 Arch kernel of that version", not "this ABI matches the VM".
#
# Nothing here touches a device. Runtime acceptance still happens on the VM.

on:
  workflow_dispatch:
    inputs:
      kernel_headers:
        description: 'ALARM headers package filename (empty = newest in core)'
        required: false
        default: ''
  push:
    branches: [ 'audit/**' ]
    paths:
      - 'virtio_gpu/**'
      - 'gunyah_guest/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-virtio-gpu-module.yml'

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Make the aarch64 toolchain and kernel headers available
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu \
            make bc flex bison libelf-dev libssl-dev xz-utils

          mirror=http://mirror.archlinuxarm.org/aarch64/core
          pkg='${{ inputs.kernel_headers }}'
          if [ -z "$pkg" ]; then
            pkg=$(curl -fsSL "$mirror/" \
                  | grep -o 'linux-aarch64-headers-[0-9][^"<]*aarch64\.pkg\.tar\.xz' \
                  | sort -u | tail -1)
          fi
          echo "headers package: $pkg"
          curl -fsSL "$mirror/$pkg" -o /tmp/headers.pkg.tar.xz
          sudo tar -xJf /tmp/headers.pkg.tar.xz -C /
          ls -d /usr/src/linux-headers-* /usr/lib/modules/*/build

      - name: Self-test the patch script
        run: python3 tests/test_pool_mmap_bounds.py

      - name: Apply the patch
        run: python3 scripts/patch_pool_mmap_bounds.py --root .

      - name: Build gunyah_guest, then the patched virtio-gpu
        run: |
          set -euxo pipefail
          KDIR=$(ls -d /usr/src/linux-headers-*/ | head -1)
          # headers-only trees ship a prepared build dir; point the module build at it
          if [ ! -e "$KDIR/Makefile" ] && [ -e "$KDIR/../build" ]; then
            KDIR=$(ls -d /usr/lib/modules/*/build | head -1)
          fi
          echo "KDIR=$KDIR"
          make -C gunyah_guest KDIR="$KDIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -C virtio_gpu  KDIR="$KDIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               KBUILD_EXTRA_SYMBOLS="$PWD/gunyah_guest/Module.symvers"
          ls -l virtio_gpu/*.ko gunyah_guest/*.ko
          modinfo virtio_gpu/virtio-gpu.ko || true
